name: Deploy to Cloud Run

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Build MCP server image and push to Container Registry
        run: |
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT }}/mcp-server:${{ github.sha }}"
          gcloud builds submit --tag "$IMAGE" --project="${{ secrets.GCP_PROJECT }}" apps/mcp-server

      - name: Deploy MCP server to Cloud Run
        run: |
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT }}/mcp-server:${{ github.sha }}"
          gcloud run deploy mcp-server \
            --image "$IMAGE" \
            --region "${{ secrets.GCP_REGION }}" \
            --project "${{ secrets.GCP_PROJECT }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 4000

      - name: Build web app image and push to Container Registry
        run: |
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT }}/news-web:${{ github.sha }}"
          gcloud builds submit --tag "$IMAGE" --project="${{ secrets.GCP_PROJECT }}" apps/web

      - name: Deploy web app to Cloud Run
        run: |
          IMAGE="gcr.io/${{ secrets.GCP_PROJECT }}/news-web:${{ github.sha }}"
          gcloud run deploy news-web \
            --image "$IMAGE" \
            --region "${{ secrets.GCP_REGION }}" \
            --project "${{ secrets.GCP_PROJECT }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 80
